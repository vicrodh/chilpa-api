# api.chilpa.app is the only address. Released Chilpa builds will carry it
# written in the code, so it never changes; the worker behind it can.
name = "chilpa-api-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-23"

# The first deploy creates the DNS record and the certificate; chilpa.app
# must be a zone on the same Cloudflare account.
routes = [
  { pattern = "api.chilpa.app", custom_domain = true }
]

# No second address a build could end up depending on.
workers_dev = false
preview_urls = false

# Secrets, never in this file; Chilpa's own applications, named as in the
# owner's secrets file:
# - LAST_FM_API_KEY, LAST_FM_SHARED_SECRET
# - DISCOGS_CLIENT_KEY, DISCOGS_CLIENT_SECRET
# - MUSICBRAINZ_CLIENT_ID, MUSICBRAINZ_CLIENT_SECRET, MUSICBRAINZ_CALLBACK_URL
# - SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
# - TIDAL_CLIENT_ID, TIDAL_CLIENT_SECRET
# - PODCASTINDEX_KEY, PODCASTINDEX_SECRET
# - SERVICE_KEYS, the keys Chilpa's builds sign with (src/signature.ts), made
#   from CHILPA_SERVICE_KEY_CI, _DEV and _FLATHUB
# scripts/put-secrets.sh loads them from that file without printing them;
# `npx wrangler secret put NAME` does one by hand. A provider without its
# secrets answers 503.

# Variables:
# - UNSIGNED_UNTIL: an ISO date such as "2026-12-31". From then on a request
#   no key in SERVICE_KEYS signed gets 403; unset, it is answered as before.
#   Set it under [vars] here and deploy.
